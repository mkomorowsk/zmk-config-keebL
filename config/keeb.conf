# keeb — ZMK keyboard config
# Applied to both halves via GitHub Actions build

# Hold-tap timing is now configured per-behavior in keeb.keymap (tapping-term-ms).
# The old global Kconfig symbols (ZMK_HOLD_TAP_TERM_MS, ZMK_HOLD_TAP_PREFER_HOLD)
# were removed in ZMK with Zephyr 4.x.


# Mouse keys (disabled — uncomment if needed)
# CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
# CONFIG_BT_CTLR_PHY_2M=n
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
